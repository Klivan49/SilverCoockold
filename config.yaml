queries:
  - q: "серебро лом"
    interval: 15
    instant: true
    notify: true
  - q: "серебро лот"
    interval: 15
    instant: true
    notify: true
  - q: "серебро"
    interval: 600
    instant: false
    notify: false
  - q: "серебряное"
    interval: 600
    instant: false
    notify: false

limits:
  max_alerts_per_cycle: 20
  catchup_max_age_hours: 12
  request_timeout: 20
  force_scan_cooldown_sec: 300
  stale_poll_sec: 180
  lead_max_price_byn: 100
  lead_negotiable: true
  require_ai_for_leads: true
  lead_digest_interval_min: 120
  lead_digest_max_items: 20
